- job:
    name: mobile_tests
    description: "Mobile tests pipeline for Appium project"
    project-type: pipeline
    concurrent: true
    parameters:
      - string:
          name: BRANCH
          default: main
          description: "Git branch name"
      - string:
          name: APK_URL
          default: https://raw.githubusercontent.com/VladimirBelaz/wishlist-mobile-tests/main/wiremock/__files/wishlist.apk
          description: "URL to download APK"
      - string:
          name: TEST_DEVICES
          default: '["Android 12","Android 14"]'
          description: 'JSON-массив устройств, например ["Android 12","Android 14"]'
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/VladimirBelaz/wishlist-mobile-tests.git
            credentials-id: github
            branches:
              - $BRANCH
      script-path: pipeline/mobile-test-pipeline.groovy